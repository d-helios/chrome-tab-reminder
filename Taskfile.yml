version: '3'

vars:
  NAME: tab-reminder
  DIST: dist
  VERSION:
    sh: >-
      sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' manifest.json
  FILES: manifest.json background.js popup.html popup.js parse.js icons
  PASSAGE_KEY: local/chrome_dev/ca.pem
  PASSAGE_PUBKEY: local/chrome_dev/ca-public_key.pem

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the zip archive (for stores that accept zips)
    run: once
    cmds:
      - mkdir -p {{.DIST}}
      - rm -f {{.DIST}}/{{.NAME}}-v{{.VERSION}}.zip
      - zip -r -X -q {{.DIST}}/{{.NAME}}-v{{.VERSION}}.zip {{.FILES}} -x '*.DS_Store'
      - echo "Built {{.DIST}}/{{.NAME}}-v{{.VERSION}}.zip"
      - unzip -l {{.DIST}}/{{.NAME}}-v{{.VERSION}}.zip

  verify:
    desc: Verify manifest.json sits at the archive root
    deps: [build]
    cmds:
      - unzip -Z1 {{.DIST}}/{{.NAME}}-v{{.VERSION}}.zip | grep -qx manifest.json
      - echo "Archive layout OK"

  stage:
    internal: true
    cmds:
      - rm -rf {{.DIST}}/pkg
      - mkdir -p {{.DIST}}/pkg
      - cp -R {{.FILES}} {{.DIST}}/pkg/

  crx:
    desc: Build a signed CRX (key from passage; required by verified uploads)
    deps: [stage]
    silent: true
    cmds:
      - |
        set -e
        CHROME="${CHROME_BIN:-/Applications/Google Chrome.app/Contents/MacOS/Google Chrome}"
        [ -x "$CHROME" ] || CHROME="$(command -v google-chrome || command -v chromium || true)"
        [ -x "$CHROME" ] || { echo "Chrome not found. Set CHROME_BIN." >&2; exit 1; }

        KEY_FILE=""
        DELETE_KEY=""
        if [ -n "${CRX_KEY:-}" ]; then
          [ -f "$CRX_KEY" ] || { echo "Signing key not found: $CRX_KEY" >&2; exit 1; }
          KEY_FILE="$CRX_KEY"
        else
          KEY_FILE="$(mktemp)"
          DELETE_KEY=1
          chmod 600 "$KEY_FILE"
          passage show "{{.PASSAGE_KEY}}" > "$KEY_FILE" || { echo "Could not read {{.PASSAGE_KEY}} from passage" >&2; exit 1; }
          grep -q 'PRIVATE KEY' "$KEY_FILE" || { echo "{{.PASSAGE_KEY}} is not a PEM private key" >&2; exit 1; }
        fi

        PROFILE="$(mktemp -d)"
        cleanup() { rm -rf "$PROFILE"; [ -n "$DELETE_KEY" ] && rm -f "$KEY_FILE"; }
        trap cleanup EXIT

        OUT="{{.DIST}}/{{.NAME}}-v{{.VERSION}}.crx"
        rm -f "{{.DIST}}/pkg.crx" "$OUT"
        "$CHROME" --user-data-dir="$PROFILE" --pack-extension="$PWD/{{.DIST}}/pkg" --pack-extension-key="$KEY_FILE"
        mv "{{.DIST}}/pkg.crx" "$OUT"
        echo "Built $OUT"

  pubkey:
    desc: Print the public key registered under Verified CRX Uploads
    silent: true
    cmds:
      - |
        set -e
        if OUT="$(passage show "{{.PASSAGE_PUBKEY}}" 2>/dev/null)"; then
          printf '%s\n' "$OUT"
        else
          passage show "{{.PASSAGE_KEY}}" | openssl pkey -pubout 2>/dev/null
        fi

  clean:
    desc: Remove the dist folder
    cmds:
      - rm -rf {{.DIST}}
