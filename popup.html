<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 320px; font: 13px system-ui, sans-serif; margin: 12px; }
  h4 { margin: 12px 0 6px; }
  #presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button, input, select { font: inherit; padding: 4px 6px; }
  .row { display: flex; gap: 6px; } .row input { flex: 1; min-width: 0; }
  #status { color: #c00; min-height: 1.2em; margin-top: 6px; }
  li { display: flex; justify-content: space-between; gap: 6px; margin: 4px 0; }
  li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul { padding: 0; list-style: none; }
</style>
<select id="scope" style="width:100%">
  <option value="tab">This tab</option>
  <option value="selected">Selected tabs (ctrl/shift-click)</option>
  <option value="window">Entire window</option>
</select>
<label style="display:block;margin-top:6px"><input type="checkbox" id="close"> Close tab(s) after setting reminder</label>
<select id="action" style="width:100%;margin-top:6px">
  <option value="notify">When due: notify only (click to open)</option>
  <option value="open">When due: reopen tab + notify</option>
</select>
<h4>Remind me in</h4>
<div id="presets"></div>
<h4>Or say when</h4>
<div class="row"><input id="nl" placeholder="next monday at 9am"><button id="nlGo">Set</button></div>
<h4>Or pick a time</h4>
<div class="row"><input id="dt" type="datetime-local"><button id="dtGo">Set</button></div>
<div id="status"></div>
<h4>Pending</h4>
<ul id="list"></ul>
<script src="parse.js"></script>
<script src="popup.js"></script>
